<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start & Cronômetro — Asgard Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14100D; --panel:#1B1611; --line:#3A2E22;
    --red:#9E2B25; --gold:#D4A02A; --cream:#EDE3D0; --muted:#AEA290;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:'Oswald',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%;
  }
  .app{width:100%; max-width:480px; padding:28px 20px 40px; text-align:center;}
  .eyebrow{color:var(--muted); font-size:13px; letter-spacing:.08em; margin:0 0 4px;}
  h1{color:var(--gold); font-size:22px; font-weight:600; text-transform:uppercase; margin:0 0 26px;}

  .durations{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:24px;}
  .dur-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--cream);
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:500;
    padding:12px 4px; border-radius:6px; cursor:pointer;
  }
  .dur-btn.active{border-color:var(--gold); color:var(--gold); background:#241C13;}
  .dur-btn:disabled{opacity:.45; cursor:default;}

  .display{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:36px 20px; margin-bottom:22px;
  }
  .status{color:var(--muted); font-size:14px; letter-spacing:.04em; text-transform:uppercase; margin:0 0 10px; min-height:18px;}
  .digits{font-size:clamp(64px,20vw,96px); font-weight:700; color:var(--cream); line-height:1; letter-spacing:.01em;}
  .digits.count{color:var(--red);}
  .digits.warn{color:var(--gold);}
  .digits.done{color:var(--red);}

  .controls{display:flex; gap:12px; justify-content:center;}
  button.main{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; text-transform:uppercase;
    letter-spacing:.03em; padding:14px 30px; border-radius:8px; border:none; cursor:pointer;
  }
  .btn-start{background:var(--gold); color:#1B1611;}
  .btn-cancel{background:transparent; color:var(--red); border:1px solid var(--red) !important;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <p class="eyebrow">Asgard Field</p>
  <h1>Start &amp; Cronômetro</h1>

  <div class="durations" id="durations">
    <button class="dur-btn active" data-ms="0">Só o start</button>
    <button class="dur-btn" data-ms="180000">3 min</button>
    <button class="dur-btn" data-ms="300000">5 min</button>
    <button class="dur-btn" data-ms="600000">10 min</button>
  </div>

  <div class="display">
    <p class="status" id="status">Pronto para iniciar</p>
    <div class="digits" id="digits">PRONTO</div>
  </div>

  <div class="controls">
    <button class="main btn-start" id="startBtn">Iniciar</button>
    <button class="main btn-cancel hidden" id="cancelBtn">Cancelar</button>
  </div>
</div>

<script>
  // Áudio real do start (fala "10 seconds" + 9 beeps + sinal final).
  // Tempos em segundos dentro do arquivo start.mp3. Ajuste aqui se trocar o áudio.
  const startAudio = new Audio('start.mp3');
  startAudio.preload = 'auto';
  const CUES = {
    beeps: [1.18, 2.195, 3.215, 4.22, 5.22, 6.245, 7.245, 8.27, 9.27], // 9 -> 1
    horn: 10.295 // sinal final: fim da contagem / início do cronômetro
  };

  let audioCtx = null;
  function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

  function tone(freq, dur, type, gainVal, delay){
    const ctx = ac();
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.3, t0+0.01);
    gain.gain.linearRampToValueAtTime(0, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function warnTone(){ tone(1400,0.18,'square',0.25,0); tone(1400,0.18,'square',0.25,0.25); }
  function buzzer(){ tone(160,0.5,'sawtooth',0.35,0); tone(160,0.5,'sawtooth',0.35,0.6); }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return Promise.resolve();
      return new Promise((resolve)=>{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.95;
        u.onend = ()=>resolve();
        u.onerror = ()=>resolve();
        speechSynthesis.speak(u);
        setTimeout(resolve, 1600); // fallback if onend never fires
      });
    }catch(e){ return Promise.resolve(); }
  }

  const digitsEl = document.getElementById('digits');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const durButtons = Array.from(document.querySelectorAll('.dur-btn'));

  let selectedMs = 0;
  durButtons.forEach(b=>b.addEventListener('click', ()=>{
    if(phase!=='idle') return;
    durButtons.forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selectedMs = Number(b.dataset.ms);
  }));

  let phase = 'idle'; // idle | countdown | startonly | match | ended
  let matchStart = 0;
  let warned = false;
  let ended = false;
  let intervalId = null;

  function setUIRunning(running){
    durButtons.forEach(b=>b.disabled = running);
    startBtn.classList.toggle('hidden', running);
    cancelBtn.classList.toggle('hidden', !running);
  }

  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60);
    const r = s%60;
    return m + ':' + String(r).padStart(2,'0');
  }

  function tick(){
    const now = Date.now();
    if(phase==='countdown'){
      const t = startAudio.currentTime;
      const k = CUES.beeps.filter(b => t >= b).length;
      digitsEl.textContent = String(10 - k);
      digitsEl.className = 'digits count';
      statusEl.textContent = 'Contagem regressiva';
      if(t >= CUES.horn || startAudio.ended){
        if(selectedMs > 0){
          phase = 'match'; warned = false; ended = false;
          matchStart = now - Math.max(0, t - CUES.horn) * 1000;
          statusEl.textContent = 'Em jogo';
        } else {
          phase = 'startonly';
          statusEl.textContent = 'Em jogo — sem cronômetro';
          digitsEl.textContent = 'GO';
          digitsEl.className = 'digits';
          cancelBtn.textContent = 'Nova rodada';
        }
      }
      return;
    }
    if(phase==='match'){
      const remaining = selectedMs - (now - matchStart);
      if(remaining <= 0){
        digitsEl.textContent = '0:00';
        digitsEl.className = 'digits done';
        if(!ended){ ended = true; buzzer(); statusEl.textContent = 'Tempo esgotado'; cancelBtn.textContent = 'Nova rodada'; }
        phase = 'ended';
        return;
      }
      digitsEl.textContent = fmt(remaining);
      if(remaining <= 60000){
        digitsEl.className = 'digits warn';
        statusEl.textContent = 'Último minuto';
        if(!warned){ warned = true; warnTone(); speak('One minute'); }
      } else {
        digitsEl.className = 'digits';
      }
    }
  }

  function reset(){
    clearInterval(intervalId); intervalId = null;
    try{ speechSynthesis.cancel(); }catch(e){}
    startAudio.pause(); startAudio.currentTime = 0;
    cancelBtn.textContent = 'Cancelar';
    phase = 'idle';
    digitsEl.textContent = 'PRONTO';
    digitsEl.className = 'digits';
    statusEl.textContent = 'Pronto para iniciar';
    setUIRunning(false);
  }

  startBtn.addEventListener('click', ()=>{
    if(phase!=='idle') return;
    const ctx = ac(); if(ctx.resume) ctx.resume();
    try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){} // libera a fala no iOS
    setUIRunning(true);
    phase = 'countdown';
    statusEl.textContent = 'Prepare-se';
    digitsEl.textContent = '10';
    digitsEl.className = 'digits count';
    startAudio.currentTime = 0;
    startAudio.play().catch(()=>{ reset(); statusEl.textContent = 'Não consegui tocar start.mp3'; });
    intervalId = setInterval(tick, 50);
  });

  cancelBtn.addEventListener('click', reset);
</script>
</body>
</html>
